<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>NextApply</title>
  </head>
  <body>
    <main class="popup">
      <div class="logo">
        <img src="/nextapply-symbole.svg" alt="" width="28" height="28" />
        <span class="logo-nom">Next<span>Apply</span></span>
      </div>

      <p id="chargement" class="secondaire">Chargement…</p>

      <section id="vue-connexion" hidden>
        <h1 class="titre">Se connecter</h1>
        <p class="secondaire">Le même compte que l’app NextApply.</p>
        <form id="form-connexion" class="formulaire" novalidate>
          <div class="champ">
            <label for="email">Courriel</label>
            <input id="email" name="email" type="email" autocomplete="email" />
          </div>
          <div class="champ">
            <label for="password">Mot de passe</label>
            <input id="password" name="password" type="password" autocomplete="current-password" />
          </div>
          <div><button id="bouton-connexion" class="bouton" type="submit">Se connecter</button></div>
        </form>
      </section>

      <!-- Étape 4 : l'offre affichée dans l'onglet -->
      <section id="vue-offre" class="partie" aria-labelledby="titre-offre" hidden>
        <h1 class="titre" id="titre-offre">Cette offre</h1>
        <p id="offre-chargement" class="secondaire">Recherche dans tes offres…</p>

        <div id="offre-inconnue" class="partie" hidden>
          <p class="secondaire">Cette page n’est pas encore dans NextApply.</p>
          <div><button id="bouton-ajouter" class="bouton" type="button">Ajouter à NextApply</button></div>
        </div>

        <div id="offre-connue" class="bloc-offre" hidden>
          <p class="statut"><span id="offre-marque" class="marque" aria-hidden="true"></span><span id="offre-statut"></span></p>
          <p id="offre-titre" class="offre-titre"></p>
          <p id="offre-details" class="secondaire"></p>
          <p id="offre-experience" class="offre-experience"></p>
          <div id="offre-doublon" class="doublon" hidden>
            <p id="offre-doublon-texte"></p>
            <div class="liens">
              <button id="bouton-retirer" class="lien" type="button">Retirer celle-ci</button>
              <button id="bouton-garder" class="lien" type="button">Garder les deux</button>
            </div>
          </div>
          <div><button id="bouton-postulee" class="bouton bouton--contour" type="button">Marquer comme postulée</button></div>
        </div>

        <p id="offre-message" class="message" role="status" hidden></p>
      </section>

      <section id="vue-remplir" class="partie" aria-labelledby="titre-remplir" hidden>
        <h2 class="titre" id="titre-remplir">Formulaire</h2>
        <p class="secondaire">
          Remplit les champs vides que l’extension reconnaît, avec ton profil. Tu relis,
          puis tu envoies toi-même.
        </p>
        <div><button id="bouton-remplir" class="bouton" type="button">Remplir cette page</button></div>
      </section>

      <p id="message" class="message" role="status" hidden></p>

      <!-- Après le message, pour que le résultat du remplissage soit juste sous le bouton -->
      <p id="pied" class="pied secondaire" hidden>
        Connecté : <span id="email-connecte"></span>.
        <button id="bouton-deconnexion" class="lien" type="button">Se déconnecter</button>
      </p>
    </main>
    <script type="module" src="/src/popup/popup.ts"></script>
  </body>
</html>
