# spring
spring.application.name=backend
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
management.endpoint.health.show-details=always

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# auth
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_URL}/auth/v1/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_URL}/auth/v1
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256

# Cors
# Origines autorisées, séparées par des virgules : l'app React et l'extension Chrome
# (son identifiant est fixé par la clé publique "key" de extension/public/manifest.json)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,chrome-extension://hlaeabgodejnlpdghobbdocknogbkfah}

# Import du CV : 5 Mo max pour le fichier, un peu plus pour toute la requête multipart
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# OpenAI (la clé vient de la variable d'environnement, jamais d'ici)
# Valeur par defaut vide : le backend demarre sans clee, seule l'analyse du CV renvoie une erreur claire
openai.api.key=${OPENAI_API_KEY:}
openai.api.url=https://api.openai.com/v1/chat/completions
openai.model=gpt-4o-mini

# Appels HTTP sortants : l'analyse d'un CV prend souvent 10 à 30 secondes
spring.http.clients.connect-timeout=10s
spring.http.clients.read-timeout=90s
